version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careerpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careerpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpilot_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=CareerPilot AI
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/careerpilot
      - VECTOR_DIMENSION=384
      - SECRET_KEY=careerpilot_super_secret_jwt_production_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerpilot_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
