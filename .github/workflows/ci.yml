name: CareerPilot AI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & AI Benchmark Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          ENVIRONMENT: testing
          SECRET_KEY: ci_secret_key_testing_12345
        run: |
          cd backend
          python -m pytest -v

      - name: Run AI Evaluation Benchmark
        run: |
          cd backend
          python eval/evaluate_ai.py

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: careerpilot-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: careerpilot-frontend:ci
